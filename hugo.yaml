baseURL: https://pin-yi.me/
languageCode: zh-tw
title: PIN-YI

enableRobotsTXT: true
enableGitInfo: true
defaultContentLanguage: en

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 1
    - identifier: archives
      name: 時間軸
      pageRef: /archives
      weight: 2
    - identifier: projects
      name: 專案成就
      pageRef: /projects
      weight: 3
    - identifier: uptime
      name: 服務狀態
      weight: 4
      url: "https://uptime.pin-yi.me/"
    - identifier: about
      name: 關於我
      weight: 5
    - name: "自我介紹"
      parent: about
      pageRef: /about
      weight: 1
    - name: "Resume 履歷 (中文)"
      parent: about
      url: "/about/resume-tw.pdf"
      weight: 2
    - name: "Resume 履歷 (英文)"
      parent: about
      url: "/about/resume-en.pdf"
      weight: 3
    - name: "個人介紹 PPT (面試用)"
      parent: about
      url: "https://resume.pin-yi.me"
      weight: 4
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/880831ian/"
      params:
        icon: github
    - name: linkedin
      weight: 7
      url: "https://www.linkedin.com/in/pinyi/"
      params:
        icon: linkedin

params:
  imageZoom:
    enable: true
  banner:
    key: "announcement"
    message: "目前 Blog 頁籤支援折疊側邊欄功能，在閱讀文章會更方便，歡迎多加利用 💪"
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.webp
      dark: images/logo.webp
    width: full

  page:
    width: full
    tabs:
      sync: true

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  footer:
    enable: false

  displayUpdatedDate: true
  dateFormat: "2006-01-02"

  comments:
    enable: true
    type: giscus
    giscus:
      repo: 880831ian/880831ian.github.io
      repoId: R_kgDOLwVzsQ
      category: General
      categoryId: DIC_kwDOLwVzsc4CezU3
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: top
      lang: zh-TW

  search:
    enable: true
    type: flexsearch

services:
  googleAnalytics:
    ID: G-VY0HEQXXJQ

outputs:
  home: [html, llms]